<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圓圓燒仙草</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 可愛、暖呼呼，像攤位阿嬤在旁邊幫你加油
   IDEA: 老街口粉紅條紋雨棚下的小攤，一週故事＋四季輪替
   PICTURE: 圓滾滾的動物客人、會眨眼的大碗、偷吃的仙草貓
   COLOUR and TYPE: 草莓牛奶粉、仙草深棕、蛋黃黃點綴；粉圓體 Huninn
   LAYOUT: 狀態列、攤位舞台、碗與配料台兩欄；手機改直排、碗與出餐鈕並排 */
:root{color-scheme:light dark;--bg:light-dark(#ffe4ea,#24161d);--ink:light-dark(#4a2a20,#ffeef2);--soft:light-dark(#8a5a50,#d9b3bf);--card:light-dark(#fff8f9,#35232c);--line:light-dark(#f6c3cf,#5a3a48);--pink:#ff7aa2;--pinkd:light-dark(#e2537f,#c94a72);--sun:#ffc93c;--wood:light-dark(#eaa874,#8a5634);--wall:light-dark(#fff3dc,#3a2833)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[data-season=winter]{--wall:light-dark(#eef3ff,#2b2a3c)}[data-season=spring]{--wall:light-dark(#fff0f6,#3a2833)}
[data-season=summer]{--wall:light-dark(#fff5c4,#3a3226)}[data-season=autumn]{--wall:light-dark(#ffeedd,#3a2a22)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Huninn','Zen Maru Gothic','PingFang TC','Noto Sans TC',sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(12px,3vw,32px) max(4vw,12px) 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.05;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px;white-space:nowrap}
.chip b{color:var(--pinkd)}
.mini{min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.timebar{height:12px;border-radius:999px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin-bottom:10px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sun),var(--pink));transition:width .1s linear}
.stage{position:relative;height:280px;--top:62px;border-radius:28px;overflow:hidden;background:var(--wall);border:3px solid var(--line);transition:background .6s}
body{--aw:#ff7aa2}[data-skin=sky]{--aw:#6cb8f0}[data-skin=lemon]{--aw:#ffc21a}[data-skin=grape]{--aw:#a98be0}[data-skin=tomato]{--aw:#ff6a55}
.awning{position:absolute;inset:0 0 auto;height:40px;background:repeating-linear-gradient(90deg,var(--aw) 0 40px,#fff 40px 80px);z-index:1}
.awning::after{content:"";position:absolute;top:40px;left:0;right:0;height:20px;background:radial-gradient(circle at 20px 0,var(--aw) 19px,transparent 20px) 0 0/80px 20px repeat-x,radial-gradient(circle at 60px 0,#fff 19px,transparent 20px) 0 0/80px 20px repeat-x}
#nextup{margin-top:8px;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:6px 12px;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
#nextup[hidden]{display:none}
#nextup .oc{background:light-dark(#fff,#2b1b23)}
.cname{color:#c2366a}
.box.wide{max-width:600px}
.tabs{display:flex;gap:6px;margin:4px 0 12px}.tabs .mini{flex:1}
.tabs .mini[aria-selected=true]{background:var(--pink);color:#fff;border-color:var(--pinkd)}
.wallet{font-size:20px;margin:0 0 8px}.wallet b{color:var(--pinkd)}
.items{display:grid;gap:8px;text-align:left;max-height:min(56vh,460px);overflow:auto;padding:2px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:light-dark(#fff,#2b1b23);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.item b{font-size:17px}.item p{margin:0;font-size:14px;color:var(--soft);grid-column:1}
.item .lv{color:var(--sun);letter-spacing:2px;font-size:14px}
.item .btn{margin:0;width:auto;min-width:96px;min-height:44px;font-size:16px;grid-row:1/3;grid-column:2;padding:0 12px;white-space:nowrap}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
#deco{position:absolute;inset:0;pointer-events:none}#deco svg{width:100%;height:100%}
.menu{position:absolute;left:18px;top:76px;width:128px;background:#3d2a22;color:#fff3e0;border:5px solid #b07a4f;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.6;transform:rotate(-3deg)}
.menu b{display:block;font-size:15px;color:var(--sun);text-align:center}
.counter{position:absolute;left:0;right:0;bottom:0;height:54px;background:var(--wood);border-top:7px solid light-dark(#c9844f,#6a3f25)}
#front{position:absolute;left:28%;bottom:30px;width:140px}
#front svg{display:block;width:100%;height:auto}
.vipb{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--sun);color:#4a2a20;border-radius:999px;padding:0 10px;font-size:13px;white-space:nowrap;z-index:2}
.pat{height:9px;border-radius:9px;background:rgba(0,0,0,.12);margin:0 18px 6px;overflow:hidden}
.pat i{display:block;height:100%;background:#7cd992;transition:width .1s linear}
#bubble{position:absolute;left:calc(28% + 150px);top:62px;max-width:300px;background:#fff;color:#4a2a20;border-radius:22px;padding:10px 14px;box-shadow:0 6px 0 rgba(120,60,70,.15);font-size:16px;z-index:2}
#bubble::before{content:"";position:absolute;left:-12px;top:30px;border:8px solid transparent;border-right:14px solid #fff;border-left:0}
#bubble:empty{display:none}
#bubble{max-height:calc(100% - var(--top) - 58px);overflow:auto;overscroll-behavior:contain}
.stage[data-sl="2"]{height:300px}.stage[data-sl="3"],.stage[data-sl="4"]{height:350px}
.note{color:#d43d5e}
.vip{background:var(--sun);border-radius:999px;padding:0 8px;font-size:13px;margin-right:4px}
.order{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.oc{display:inline-flex;align-items:center;gap:4px;background:#ffeef3;border-radius:999px;padding:2px 10px 2px 3px;font-size:15px;white-space:nowrap}
.oc.done{background:#dff6e5;text-decoration:line-through;text-decoration-color:#4bb26a}
.oc svg{width:22px;height:22px;flex:none}
#queue{position:absolute;right:14px;bottom:36px;display:flex;gap:4px;align-items:flex-end}
#queue svg{width:64px;height:auto}
#qn{position:absolute;right:10px;top:54px;display:none;z-index:2}
#idle{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:22px;color:var(--soft);white-space:nowrap}
#pop{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:18px;line-height:1.3;padding:6px 16px;border-radius:999px;background:#fff;color:#4a2a20;white-space:nowrap;opacity:0;pointer-events:none;z-index:4;box-shadow:0 4px 14px rgba(120,40,60,.2);max-width:calc(100% - 20px);text-align:center}
#pop.float{position:fixed;top:14px;bottom:auto;z-index:9}
#pop.good{color:#2f9a52}#pop.bad{color:#d43d5e}#pop.warn{color:#b07800}
#pop.show{animation:pop 1.5s ease-out}
@keyframes pop{0%{opacity:0;translate:0 8px}12%{opacity:1;translate:0 0}80%{opacity:1}100%{opacity:0}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-top:14px}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px}
.card h2{font-size:17px;margin:0 0 8px;color:var(--soft);font-weight:500}
#bowls{display:grid;gap:6px;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));max-width:340px;margin:0 auto;width:100%}
.bw{position:relative;background:none;border:2px solid transparent;border-radius:16px;padding:2px;cursor:pointer;font:inherit;color:var(--soft)}
.bw.on{border-color:var(--pink);background:light-dark(#fff0f4,#40263a)}
.bw.solo{cursor:default}
.bw.wk{border:2px dashed var(--line);cursor:default}
.bw.wk span{color:#2f9a52}
.bw span{position:absolute;left:6px;top:2px;font-size:13px}
.bw.on span{color:var(--pinkd);font-weight:700}
.tut{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;text-align:left;margin:10px 0 6px;align-items:start}
.tut .bn{width:26px;height:26px;font-size:14px}
.bw svg{display:block;width:100%;height:auto}
.bw:focus-visible{outline:3px solid var(--sun)}
#bubble.multi{font-size:14px}#bubble.multi .order{margin-top:3px;align-items:center}
#bubble.multi .oc{font-size:13px;padding:1px 7px 1px 2px}#bubble.multi .oc svg{width:18px;height:18px}
.bn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pink);color:#fff;font-size:12px;flex:none}
.cntb{position:absolute;right:-6px;top:22px;background:var(--pink);color:#fff;border-radius:999px;padding:0 8px;font-size:13px;z-index:2;white-space:nowrap}
.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1.2;min-height:50px;border-radius:16px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink);background:light-dark(#fff,#2b1b23);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--pink);border-color:var(--pinkd);color:#fff;box-shadow:0 4px 0 var(--pinkd)}
.btn:focus-visible,.tp:focus-visible,.mini:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn[disabled],.tp[disabled]{opacity:.45;cursor:default;box-shadow:none}
.bases{display:flex;gap:10px;margin-bottom:10px}.bases .btn{flex:1}
#hot[aria-pressed=true]{background:#5a3524;border-color:#3a2216;color:#ffe9d6;box-shadow:0 4px 0 #2a170e}
#ice[aria-pressed=true]{background:#dff1ff;border-color:#8fc6ea;color:#24506e;box-shadow:0 4px 0 #8fc6ea}
.tops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;border-radius:16px;background:light-dark(#fff,#2b1b23);border:2px solid var(--line);font:inherit;font-size:16px;color:var(--ink);cursor:pointer;min-height:44px}
.tp[aria-pressed=true]{border-color:var(--pink);background:light-dark(#ffe6ee,#4c2a3a);box-shadow:inset 0 0 0 2px var(--pink)}
.tp.out{border-style:dashed;border-color:#d43d5e;background:light-dark(#fff1f1,#3a2020)}
.tp.out svg{opacity:.3}
.tp small,kbd{font-size:13px;color:var(--soft);font-family:inherit;white-space:nowrap}
.tp.out small{color:#d43d5e}
#milk{flex:.8}
#milk[aria-pressed=true]{background:#fffaf0;color:#4a2a20;border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.cat{position:absolute;top:-18px;right:6px;width:84px;background:none;border:0;padding:0;cursor:pointer;z-index:3;animation:wig .45s ease-in-out infinite alternate}
.cat svg{width:100%;height:auto;display:block}
.cat span{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:#fff;color:#d43d5e;border-radius:999px;padding:0 8px;font-size:13px;white-space:nowrap}
@keyframes wig{to{transform:rotate(6deg)}}
.ov{position:fixed;inset:0;background:rgba(70,25,40,.5);display:grid;place-items:center;padding:16px;z-index:8;overflow:auto}
.ov[hidden]{display:none}
.box{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:22px;max-width:440px;width:100%;text-align:center}
.box h2{font-size:clamp(26px,6vw,32px);line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.box p{text-align:left;margin:8px 0}
.box .unlock{background:light-dark(#fff1c9,#4a3a20);border-radius:14px;padding:8px 12px;font-size:15px;text-align:left}
.box ul{text-align:left;padding-left:1.2em;margin:10px 0 14px}
.box .btn{width:100%;margin-top:8px}
.stars{font-size:36px;color:var(--sun);letter-spacing:6px}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;margin:12px 0}
.res span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:13px;color:var(--soft);margin:10px 0 0;text-align:center}
@media(max-width:600px){
 header{gap:4px 6px;margin-bottom:6px;flex-wrap:nowrap}header h1{display:none}.stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#mute{min-height:32px;min-width:0;font-size:13px;padding:0 10px;flex:none}
 .chip{font-size:13px;padding:2px 9px}.mhide{display:none}
 .timebar{height:9px;margin-bottom:6px}
 .stage{height:206px;border-radius:22px}
 .stage[data-sl="2"]{height:236px}.stage[data-sl="3"],.stage[data-sl="4"]{height:262px}
 #bubble .oc{font-size:14px;padding:1px 7px 1px 2px;gap:3px}#bubble .oc svg{width:18px;height:18px}#bubble .order{gap:4px}
 kbd{display:none}
 .tp .pr{display:none}.tp small:has(> .pr:only-child){display:none}
 .tp{min-height:58px;justify-content:center}
 .bases{gap:6px;margin-bottom:8px}.bases .btn{font-size:16px;min-height:46px;padding:0 4px}
 .card{padding:10px;border-radius:20px}
 .card>h2{display:none}
 #bowls{grid-template-columns:repeat(var(--m,1),minmax(0,1fr));max-width:none}
 .bw span{font-size:12px;left:4px;top:0}
 .bw svg{margin-top:8px}
 .row{margin-top:8px}.row .btn{min-height:46px;font-size:16px}
 #nextup{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;font-size:13px;padding:4px 10px;margin-top:6px;gap:4px;scrollbar-width:none}
 #nextup .oc{font-size:13px;padding:1px 6px;flex:none}#nextup .oc svg{display:none}#nextup>span{flex:none}
 .menu,#queue{display:none}
 #qn{display:block}
 #front{left:6px;width:104px;bottom:28px}
 #bubble{left:116px;right:8px;top:56px;font-size:14px;padding:8px 10px}
 #pop:not(.float){left:auto;right:8px;bottom:7px;transform:none;max-width:calc(100% - 124px);white-space:normal;font-size:15px;border-radius:14px;padding:4px 10px}
 #bubble.multi .oc svg{display:none}
 #bubble.multi .oc{padding:1px 7px;font-size:13px}
 .oc{font-size:14px}
 .work{grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
 .hint.desk{display:none}
 .tp{font-size:15px;padding:6px 1px 4px}
 .tp svg{width:28px;height:28px}
 .cat{width:54px;top:-30px;right:12px;left:auto}
 .cat span{font-size:12px;padding:0 6px}
 #qn{top:auto;bottom:5px;right:auto;left:8px;font-size:13px;padding:1px 10px}
}
.gskip{background:none;border:0;color:#a07a80;font:inherit;font-size:14px;text-decoration:underline;min-height:44px;cursor:pointer;padding:0}
#spot{position:fixed;z-index:10;pointer-events:none;border-radius:18px;box-shadow:0 0 0 4px var(--sun),0 0 0 200vmax rgba(50,15,30,.5);transition:left .25s,top .25s,width .25s,height .25s;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--sun),0 0 0 200vmax rgba(50,15,30,.5)}}
#gtip{position:fixed;z-index:11;width:min(320px,92vw);background:#fff;color:#4a2a20;border-radius:18px;padding:12px 14px 4px;box-shadow:0 8px 24px rgba(60,20,30,.3);font-size:16px;line-height:1.5}
#gtip .gb{display:flex;justify-content:space-between;align-items:center;gap:8px}
#gtip small{color:#c2366a;font-size:14px}
#gtip .btn{min-height:42px;font-size:16px;padding:0 18px;margin:4px 0 8px}
#spot[hidden],#gtip[hidden]{display:none}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.thead h2{margin:0}
#pause{flex:0 0 auto!important;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 14px;border-radius:999px;border:2px solid var(--pinkd);background:var(--pink);color:#fff;font:inherit;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--pinkd)}
#pause[hidden]{display:none}
#pause i{display:block;width:4px;height:14px;border-radius:2px;background:#fff}
#pause i+i{margin-left:-2px}
#pause:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pinkd)}
#pause:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#spot{animation:none}.bob,.cat,#pop.show{animation:none}#pop.show{opacity:1}}
</style>
</head>
<body data-season="winter">
<div class="wrap">
 <header>
  <h1>圓圓燒仙草</h1>
  <div class="stats">
   <span class="chip">第 <b id="day">1</b> 天・<span id="wx">冬・晴天</span></span>
   <span class="chip">今日 <b id="money">$0</b></span>
   <span class="chip mhide">錢包 <b id="wallet">$0</b></span>
   <span class="chip">剩 <b id="time">75</b> 秒</span>
   <span class="chip mhide" id="combo">連續 <b>0</b></span>
  </div>
  <button class="mini" id="mute" aria-pressed="false">音效 開</button>
 </header>
 <div class="timebar"><i id="tbar"></i></div>

 <div class="stage">
  <div id="deco"></div>
  <div class="awning"></div>
  <div class="menu" id="menu"></div>
  <div id="idle">今天還沒開店</div>
  <div id="front"></div>
  <div id="bubble" aria-live="polite"></div>
  <div id="queue"></div>
  <span class="chip" id="qn">排隊 0 人</span>
  <div class="counter"></div>
  <div id="pop"></div>
 </div>
 <div id="nextup" hidden></div>

 <div class="work">
  <section class="card bowlcard">
   <h2>你的碗</h2>
   <div id="bowls"></div>
   <div class="row">
    <button class="btn" id="reset">倒掉這碗</button>
    <button class="btn main" id="serve">出餐！</button>
    <button id="pause" hidden aria-label="暫停遊戲"><i></i><i></i><span>暫停</span></button>
   </div>
   <button class="cat" id="cat" hidden aria-label="趕走仙草貓"></button>
  </section>
  <section class="card">
   <h2>配料台</h2>
   <div class="bases">
    <button class="btn" id="hot" aria-pressed="false">燒仙草 <kbd>Q</kbd></button>
    <button class="btn" id="ice" aria-pressed="false">仙草冰 <kbd>W</kbd></button>
    <button class="btn" id="milk" aria-pressed="false">加奶 <kbd>M</kbd></button>
   </div>
   <div class="tops" id="tops"></div>
   <p class="hint desk">鍵盤：Q／W 湯底、1～8 配料、M 奶、A／S／D／F 切換碗、空白鍵出餐、⌫ 倒掉、P 暫停</p>
  </section>
 </div>
</div>
<div id="spot" hidden></div><div id="gtip" hidden role="dialog" aria-live="polite"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>

<script>
{
const TOPS=[
 {id:'taro',n:'芋圓',c:'#b79ad8',s:'cube',d:1},
 {id:'pearl',n:'粉圓',c:'#8a5a3e',s:'ball',d:1},
 {id:'peanut',n:'花生',c:'#e6c088',s:'nut',d:1},
 {id:'bean',n:'紅豆',c:'#c0404f',s:'bean',d:1},
 {id:'sweet',n:'地瓜圓',c:'#f6a646',s:'cube',d:2},
 {id:'tang',n:'小湯圓',c:'#fff0f3',s:'ball',d:3},
 {id:'pud',n:'布丁',c:'#ffd45c',s:'pud',d:5},

}

 const nb=S.money>S.best;if(nb)S.best=S.money;S.wallet+=S.money;save();hud();
 const last=S.day==7&&stars>=1;
 const show=()=>{overlay(`<h2>今天打烊囉！</h2><div class="stars" aria-label="${stars} 顆星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
 <div class="res"><span>第 ${S.day} 天營收</span><span><b>$${S.money}</b>${nb?' 新紀錄！':''}</span><span>兩顆星目標</span><span>$${goal}</span><span>服務客人</span><span>${S.served} 位</span><span>錯過客人</span><span>${S.missed} 位</span><span>錢包</span><span>$${S.wallet}</span><span>累計營收</span><span>$${S.total+(stars?S.money:0)}</span></div>
 ${stars?'':'<p class="hint">要拿到至少一顆星（$'+goal/2+'）才能進到下一天喔</p>'}
 ${stars?`<button class="btn main" id="next">${last?'看結局':`前往第 ${S.day+1} 天`}</button>`:''}
 <button class="btn" id="shopb">逛設備店（錢包 $${S.wallet}）</button>
 <button class="btn${stars?'':' main'}" id="again">${stars?'這一天再玩一次':'再挑戰一次'}</button>`,stars?'next':'again');
 $('again').onclick=startDay;$('shopb').onclick=()=>shop('up',show);
 if(stars)$('next').onclick=()=>{S.total+=S.money;S.day++;save();last?ending():chapter()};
 if(stars)once('shop',[{el:()=>$('shopb'),text:'今天賺的錢存進<b>錢包</b>了！點這裡逛設備店。',wait:'click'},{el:()=>$('box').querySelector('.items'),text:'錢夠的設備，按鈕會變粉紅色，點一下就買了。上面還能切換「外觀」和「招牌本」。'}])};
 show();
}
function ending(){
 overlay(`<svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">${face('bunny','happy').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>
 <h2>結局・攤子的鑰匙</h2>
 <p>收攤後，阿嬤吃了一口你做的燒仙草，慢慢點頭：「嗯，有阿嬤的味道。」</p>
 <p>她把一串磨得發亮的鑰匙放到你手心：「以後這攤，就交給圓圓了。」隔壁的阿福在旁邊拍手拍到雞排差點掉地上。</p>
 <div class="unlock">第一週累計營收 $${S.total}｜接下來進入無盡營業：四季輪替、客人越來越多</div>
 <button class="btn main" id="go">繼續營業</button>`,'go');
 $('go').onclick=chapter;
}
function intro(){
 const cont=S.day>1;
 overlay(`<svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">${face('bunny','happy').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>
 <h2>圓圓燒仙草</h2>
 <p>阿嬤住院了，換你回老街顧這攤四十年的燒仙草。撐過一週，阿嬤就會回來看你。</p>
 <ul><li>先選湯底，再照客人說的加配料，做好按「出餐」</li><li>出餐越快小費越多，連續做對還有加碼</li><li>小心缺貨、偷吃的仙草貓、臨時改點的客人</li><li>打烊後用錢包買設備、僱工讀生，最多同時做 4 碗，還能發現隱藏的招牌組合</li></ul>
 ${cont?`<button class="btn main" id="go">繼續第 ${S.day} 天</button><button class="btn" id="restart">從第 1 天重新開始</button>`:'<button class="btn main" id="go">開始故事</button>'}`,'go');
 $('go').onclick=chapter;
 if(cont)$('restart').onclick=()=>{S.day=1;S.total=0;save();chapter()};
}
function pause(){if(!S.running||S.paused)return;S.paused=true;$('pause').hidden=true;$('spot').hidden=$('gtip').hidden=true;overlay(`<h2>休息一下</h2><p style="text-align:center">客人會乖乖等你回來。</p><button class="btn main" id="go">繼續營業</button><button class="btn" id="reg">重看所有教學</button>`,'go');$('go').onclick=resume;$('reg').onclick=()=>{S.seen={};save();$('reg').textContent='好了！遇到新東西時會再教一次';$('reg').disabled=true}}
function resume(){S.paused=false;$('ov').hidden=true;$('pause').hidden=!S.running;if(G.cur){$('spot').hidden=$('gtip').hidden=false;place()}}
/* 新手引導：亮起要點的地方，一步一步教 */
const G={q:[],cur:null,iv:null};
const qs=s=>document.querySelector(s);
function once(k,steps,alive){if(S.seen[k])return;S.seen[k]=1;save();steps.forEach((s,i)=>{s.g=k;if(alive&&!s.after)s.alive=alive});G.q.push(...steps);if(!G.cur)nextStep()}
function nextStep(){
 const st=G.q.shift();G.cur=st||null;
 if(!st){S.guide=false;$('spot').hidden=$('gtip').hidden=true;clearInterval(G.iv);G.iv=null;return}
 if(st.skip&&st.skip()){nextStep();return}
 S.guide=true;
 const el=st.el();if(el&&el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'});
 const left=G.q.length;
 $('gtip').innerHTML=`<div>${st.text}</div><div class="gb"><button class="gskip" id="gskip">跳過教學</button>${st.wait?`<small>${st.wait=='click'?'點一下亮起來的地方':'照著做，完成就會繼續'}</small>`:`<button class="btn main" id="gnext">${left?'下一步':'知道了'}</button>`}</div>`;
 $('gtip').hidden=$('spot').hidden=false;
 if($('gnext')){$('gnext').onclick=nextStep;$('gnext').focus({preventScroll:true})}
 $('gskip').onclick=()=>{G.q=[];nextStep()};
 place();
 if(!G.iv)G.iv=setInterval(()=>{if(!G.cur||S.paused)return;const c=G.cur;if(c.alive&&!c.alive()){G.q=G.q.filter(s=>s.g!==c.g);nextStep();return}place();const w=c.wait;if(typeof w=='function'&&w())nextStep()},150);
}
function place(){
 const st=G.cur,el=st&&st.el(),sp=$('spot'),tp=$('gtip'),vw=innerWidth,vh=innerHeight,tw=tp.offsetWidth,th=tp.offsetHeight;
 if(!el||!el.getClientRects().length){Object.assign(sp.style,{left:vw/2+'px',top:vh/2+'px',width:'0px',height:'0px'});tp.style.left=(vw-tw)/2+'px';tp.style.top=(vh-th)/2+'px';return}
 const r=el.getBoundingClientRect(),pad=6;
 Object.assign(sp.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
 let top=r.bottom+16;if(top+th>vh-8)top=r.top-th-16;if(top<8)top=Math.min(vh-th-8,Math.max(8,r.top+12));
 tp.style.top=top+'px';tp.style.left=Math.min(Math.max(8,r.left+r.width/2-tw/2),vw-tw-8)+'px';
}
addEventListener('resize',()=>G.cur&&place());
document.addEventListener('click',e=>{const st=G.cur;if(!st||st.wait!=='click')return;const el=st.el();if(el&&el.contains(e.target))setTimeout(nextStep,0)},true);
const baseName=b=>b=='ice'?'仙草冰':'燒仙草';
function onFront(f){
 if(!S.running||f.react||S.queue[0]!==f)return;
 const W=f.bowls,w=W[0],al=()=>S.queue[0]===f&&!f.react;
 if(W.length==1)once('basic',[
  {el:()=>$('bubble'),text:'客人來了！上面的對話框就是他要的：<b>湯底＋配料</b>。'},
  {el:()=>$(w.base=='ice'?'ice':'hot'),text:`第一步：點「${baseName(w.base)}」，先盛好一碗。`,wait:'click',skip:()=>B.base==w.base},
  {el:()=>$('tops'),text:'第二步：照對話框點配料。點過的配料，訂單上會被劃掉。',wait:()=>w.tops.every(t=>B.tops.has(t))},
  ...(w.milk?[{el:()=>$('milk'),text:'他還要加鮮奶，點這裡。',wait:'click',skip:()=>B.milk}]:[]),
  {el:()=>$('serve'),text:'訂單全部劃掉了！按「出餐」送給客人。',wait:'click',skip:()=>lv('autosrv')>0},
  {el:()=>$('money').closest('.chip'),text:'賺到的錢會加在這裡。出餐越快、小費越多，加油！',after:1}],al);
 if(f.vip)once('vip',[{el:()=>$('front'),text:'頭上掛「網紅」牌子的是網紅客人！做對會發文讓攤子爆紅，做錯會被留負評扣錢。'}],al);
 if(W.some(x=>x.name))once('combo',[{el:()=>$('bubble'),text:'客人點了你發現過的<b>招牌組合</b>！照下面的配料做，他會付 1.5 倍的錢。'}],al);
 if(W.length>1)once('multi',[
  {el:()=>$('bubble'),text:`這組客人一次要 <b>${W.length} 碗</b>！每一行前面的粉紅數字，就是第幾碗。`},
  {el:()=>qs('.bw[data-i="0"]'),text:'下面是你的碗，<b>粉紅框＝正在做的那碗</b>。先從第 1 碗開始。'},
  {el:()=>$('hot').closest('.card'),text:'照訂單第 1 行，把第 1 碗做好（湯底＋配料）。',wait:()=>eqB(BW[0],W[0])},
  {el:()=>qs('.bw.on'),text:'第 1 碗完成，自動換到下一碗了！照下一行繼續做。想自己換碗，直接點那個碗就可以。'},
  {el:()=>$('serve'),text:'全部的碗都做好之後，再按「出餐」一次送出去。'}],al);
}
function dayGuides(){
 const nw=TOPS.filter(t=>t.d==S.day);
 if(nw.length&&S.day>1)once('top'+S.day,nw.map(t=>({el:()=>qs(`.tp[data-id="${t.id}"]`),text:`新配料：<b>${t.n}</b>！今天開始客人也會點它。`})));
 if(iceOn())once('ice',[{el:()=>$('ice'),text:'夏天解鎖<b>仙草冰</b>！客人點冰的就按這裡。冰的加奶會變成「淋煉乳」。'}]);
 if(nSlots()>1)once('slots'+nSlots(),[{el:()=>$('bowls'),text:`你現在有 <b>${nSlots()} 個碗位</b>！點碗可以切換正在做哪一碗，有客人點好幾碗時會一步一步教你。`}]);
 if(lv('board'))once('board',[{el:()=>$('nextup'),text:'<b>小白板</b>會先告訴你下一位要什麼，空著的碗可以先備料。'}]);
 if(lv('autosrv'))once('autosrv',[{el:()=>$('serve'),text:'<b>自動出餐</b>開啟了！整單做好，工讀生會自動送給客人。想自己按出餐也可以。'}]);
 if(lv('helper'))once('helper',[{el:()=>$('bowls'),text:'<b>打工小幫手</b>會照訂單幫空碗先盛好湯底，你只要加配料就好。'}]);
}
function autoNext(){const f=S.queue[0];if(!f||f.react||f.bowls.length<2)return;const W=f.bowls;if(act>=W.length||!eqB(BW[act],W[act]))return;
 const nx=W.findIndex((w,i)=>i<BW.length&&!isW(i)&&!eqB(BW[i],w));const done=act+1;
 if(nx<0){const wait=W.some((w,i)=>isW(i)&&BW[i]&&!eqB(BW[i],w));pop(wait?'你的碗都好了！等工讀生做完就能出餐':'都做好了，按「出餐」！','good');return}
 act=nx;B=BW[act];drawBowl();pop(`第 ${done} 碗好了！換做第 ${nx+1} 碗`,'good')}

/* 操作 */
const noBase=()=>{pop('先選燒仙草或仙草冰喔！','warn');snd('warn')};
function toggleTop(id){
 const t=TBY[id];if(!S.running||S.paused||!unlocked(t))return;
 if(S.out[id]){if(!S.refill[id]){S.refill[id]=lv('box')?.4:1.2;renderTops();snd('add')}return}
 if(!B.base)return noBase();
 B.tops.has(id)?B.tops.delete(id):B.tops.add(id);snd('add');drawBowl();autoNext();
}
function setBase(b){if(!S.running||S.paused||(b=='ice'&&!iceOn()))return;B.base=b;snd('add');drawBowl();autoNext()}
$('tops').addEventListener('click',e=>{const b=e.target.closest('.tp');if(b)toggleTop(b.dataset.id)});
$('hot').onclick=()=>setBase('hot');$('ice').onclick=()=>setBase('ice');
$('milk').onclick=()=>{if(!S.running||S.paused)return;if(!B.base)return noBase();B.milk=!B.milk;snd('add');drawBowl();autoNext()};
$('reset').onclick=()=>{if(!S.running||S.paused)return;BW[act]=B=emptyB();drawBowl()};
const pick=i=>{if(i>=BW.length)return;if(isW(i)){pop(`第 ${i+1} 碗交給${WN[i-2]}就好，她會自動做`.replace('她會',i==3?'他會':'她會'),'warn');return}act=i;B=BW[i];drawBowl()};
$('bowls').addEventListener('click',e=>{const b=e.target.closest('.bw');if(b)pick(+b.dataset.i)});
$('serve').onclick=serve;
$('cat').onclick=()=>{if(!S.cat)return;if(S.cat.cameo){pop('是仙草貓！阿嬤說牠很愛偷吃配料','good');snd('meow')}else if(S.cat.lucky){S.money+=20;pop('招財貓叼來小費 +$20','good');snd('coin');hud()}else{pop('噓～去去去！','good');snd('meow')}hideCat()};
$('pause').onclick=()=>S.paused?resume():pause();
const muteLabel=()=>{$('mute').textContent=S.muted?'音效 關':'音效 開';$('mute').setAttribute('aria-pressed',S.muted)};
$('mute').onclick=()=>{S.muted=!S.muted;muteLabel();save();snd('add')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('keydown',e=>{
 if(!$('ov').hidden||!S.running)return;
 const k=e.key.toLowerCase();
 if(k=='q')setBase('hot');else if(k=='w')setBase('ice');
 else if(k>='1'&&k<='8'){const t=TOPS[+k-1];if(t)toggleTop(t.id)}
 else if(k=='m')$('milk').click();
 else if(k=='p')pause();
 else if(k==' '||k=='enter'){e.preventDefault();serve()}
 else if(k=='backspace'){e.preventDefault();$('reset').click()}
 else if(k=='c')$('cat').click();
 else if('asdf'.includes(k)&&k)pick('asdf'.indexOf(k));
});
muteLabel();drawDeco();renderTops();drawBowl();renderFront();hud();intro();
}
</script>
</body>
</html>
