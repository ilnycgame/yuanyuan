/* VOICE: 可愛、暖呼呼，像攤位阿嬤在旁邊幫你加油

   COLOUR and TYPE: 草莓牛奶粉、仙草深棕、蛋黃黃點綴；粉圓體 Huninn

:root{color-scheme:light dark;--cream:#FFF3DF;--caramel:#875C43;--jelly:#43342F;--bean:#D99A91;--matcha:#A4B58C;--honey:#E8BD70;--bg:light-dark(#FFF3DF,#2A2220);--ink:light-dark(#43342F,#FFF3DF);--soft:light-dark(#875C43,#D9BFA8);--card:light-dark(#FFFAF2,#372C28);--line:light-dark(#E6CFB2,#5C4A42);--pink:#D99A91;--pinkd:#B9766C;--sun:#E8BD70;--wood:light-dark(#C99868,#7A5638);--wall:light-dark(#FFF3DF,#33282A);--btn:light-dark(#FFFDF8,#40332E);--sel:light-dark(#F7E3DA,#4E3833)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[data-season=winter]{--wall:light-dark(#F3EEE6,#2C2A2E)}[data-season=spring]{--wall:light-dark(#FCEEE6,#33282A)}
[data-season=summer]{--wall:light-dark(#FFF1D6,#352E24)}[data-season=autumn]{--wall:light-dark(#F9E7D3,#352A22)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Huninn','Zen Maru Gothic','PingFang TC','Noto Sans TC',sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}

.stage{position:relative;height:280px;--top:62px;border-radius:28px;overflow:hidden;background:var(--wall);border:3px solid var(--line);transition:background .6s}
body{--aw:#D99A91}[data-skin=sky]{--aw:#6cb8f0}[data-skin=lemon]{--aw:#ffc21a}[data-skin=grape]{--aw:#a98be0}[data-skin=tomato]{--aw:#ff6a55}[data-skin=wood]{--aw:#b07a4f}

 if(S.out[id]){if(!S.refill[id]){S.refill[id]=(lv('box')?.4:1.2)*(eq('icebox')?.7:1);renderTops();snd('add')}return}
 if(!B.base)return noBase();
 const q=B.tops.get(id)||0;if(q>=2){B.tops.delete(id);pop(`最多兩勺，${t.n}先拿掉了`,'warn')}else{B.tops.set(id,q+1);LA.b=B;LA.id=id;burst(qs(`.tp[data-id="${id}"]`))}snd('add');drawBowl();autoNext();
}
function setBase(b){if(!S.running||S.paused||(b=='ice'&&!iceOn()))return;B.base=b;snd('add');drawBowl();autoNext()}
$('tops').addEventListener('click',e=>{const b=e.target.closest('.tp');if(b)toggleTop(b.dataset.id)});
$('hot').onclick=()=>setBase('hot');$('ice').onclick=()=>setBase('ice');
$('milk').onclick=()=>{if(!S.running||S.paused)return;if(!B.base)return noBase();B.milk=!B.milk;snd('add');drawBowl();autoNext()};
$('reset').onclick=()=>{if(!S.running||S.paused)return;BW[act]=B=emptyB();drawBowl()};
const pick=i=>{if(i>=BW.length)return;if(isW(i)){pop(`第 ${i+1} 碗交給${WN[i-2]}就好，她會自動做`.replace('她會',i==3?'他會':'她會'),'warn');return}act=i;B=BW[i];drawBowl()};
$('bowls').addEventListener('click',e=>{const b=e.target.closest('.bw');if(b)pick(+b.dataset.i)});
$('serve').onclick=serve;
$('cat').onclick=()=>{if(!S.cat)return;if(S.cat.cameo){pop('是仙草貓！阿嬤說牠很愛偷吃配料','good');snd('meow')}else if(S.cat.lucky){S.money+=20;S.stat.bonus+=20;pop('招財貓叼來小費 +$20','good');snd('coin');hud()}else{pop('噓～去去去！','good');snd('meow')}hideCat()};
$('pause').onclick=()=>S.paused?resume():pause();
const muteLabel=()=>{$('mute').textContent=S.muted?'音效 關':'音效 開';$('mute').setAttribute('aria-pressed',S.muted)};
$('mute').onclick=()=>{S.muted=!S.muted;muteLabel();save();snd('add')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('keydown',e=>{
 if(!$('ov').hidden||!S.running)return;
 const k=e.key.toLowerCase();
 if(k=='q')setBase('hot');else if(k=='w')setBase('ice');
 else if(k>='1'&&k<='8'){const t=TOPS[+k-1];if(t)toggleTop(t.id)}
 else if(k=='m')$('milk').click();
 else if(k=='p')pause();
 else if(k==' '||k=='enter'){e.preventDefault();serve()}
 else if(k=='backspace'){e.preventDefault();$('reset').click()}
 else if(k=='c')$('cat').click();
 else if('asdf'.includes(k)&&k)pick('asdf'.indexOf(k));
});
function whatsNew(){
 const old=S.day>1||S.wallet||S.seen.practiced;
 if(!old||S.lastVer==VER||!NOTES[VER]){if(S.lastVer!=VER){S.lastVer=VER;save()}intro();return}
 overlay(`<h2>更新公告・${VER}</h2><ul>${NOTES[VER].map(x=>`<li>${x}</li>`).join('')}</ul><p class="hint">你的進度都還在，可以接著玩。</p><button class="btn main" id="go">知道了</button>`,'go');
 $('go').onclick=()=>{S.lastVer=VER;save();intro()};
}
/* 自動檢查新版本（只在正式網站上） */
const IS_SITE=/github\.io$/.test(location.hostname);
function checkUpd(){if(!IS_SITE||typeof fetch!='function')return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.v&&j.v!==VER){S.newVer=j.v;showUpd()}}).catch(()=>{})}
function showUpd(){const b=$('upd');if(!b||!S.newVer||S.running)return;b.querySelector('span').textContent=`有新版本 ${S.newVer}`;b.hidden=false}
$('upd').onclick=()=>{location.replace(location.pathname+'?v='+encodeURIComponent(S.newVer))};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});
muteLabel();drawDeco();renderTops();drawBowl();renderFront();hud();whatsNew();checkUpd();
}
</script>
</body>
